<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Need-based deployment dashboard</title>
<style>
:root{
  --ink:#1E2B32; --muted:#5B6B72; --paper:#FFFFFF; --canvas:#EEF2F1; --line:#D3DCDA;
  --teal:#12646B; --teal-soft:#DCEDEC; --high:#A8323E; --high-soft:#F6E1E3;
  --normal:#8C6D1F; --normal-soft:#F3ECD8; --low:#4F6E8F; --low-soft:#E1E9F2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#E4ECEB; --muted:#9DB0B3; --paper:#1A2428; --canvas:#11181B; --line:#2E3C41;
  --teal:#5FB7BD; --teal-soft:#1E3A3D; --high:#E07983; --high-soft:#3B2226;
  --normal:#D5B661; --normal-soft:#3A3220; --low:#8EB0D3; --low-soft:#22303D; color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--canvas);font-size:15px;line-height:1.45}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
header h1{font-size:20px;margin:0;font-weight:600}
header p{margin:0;color:var(--muted);font-size:13px}
.proto{margin-left:auto;font-size:12px;color:var(--high);border:1px solid var(--high);border-radius:4px;padding:2px 8px}
.wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 56px)}
aside{background:var(--paper);border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:18px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
nav button:hover{background:var(--canvas)}
nav button[aria-current=page]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.cadre{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--teal);border-radius:8px;overflow:hidden}
.cadre button{border:0;padding:10px 0;font:inherit;font-weight:600;background:var(--paper);color:var(--teal);cursor:pointer}
.cadre button+button{border-left:1px solid var(--teal)}
.cadre button[aria-pressed=true]{background:var(--teal);color:var(--paper)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
select,input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{padding:22px 28px;min-width:0}
h2{font-size:22px;font-weight:600;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c,var(--teal));border-radius:6px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-weight:600}
.tile span{font-size:13px;color:var(--muted)}
section.box{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:18px}
section.box h3{margin:0 0 10px;font-size:16px;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.got td{background:var(--teal-soft)}
.band{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.band.high{background:var(--high-soft);color:var(--high)} .band.normal{background:var(--normal-soft);color:var(--normal)} .band.low{background:var(--low-soft);color:var(--low)}
.note{color:var(--high);font-size:13px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:14px;background:var(--teal);border-radius:3px}
.bar.h i{background:var(--high)}
.alloc{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:end;margin-bottom:14px}
.alloc div{min-width:180px}
.meter{height:12px;background:var(--canvas);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--teal)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pf .tile b{font-size:20px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
.method p,.method li{max-width:75ch}
.empty{color:var(--muted);padding:12px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
details.box summary{cursor:pointer;font-size:15px}
.recv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px}
.recv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0;font-size:14px}
.recv small{color:var(--muted)} .recv b{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:var(--paper);cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--teal)}
@media (max-width:820px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.bar{grid-template-columns:110px 1fr 50px}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}.mwrap{position:relative}
.mp h3{margin:0 0 8px}.mts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.mt{background:var(--soft,rgba(127,127,127,.08));border-radius:8px;padding:8px 10px}.mt b{display:block;font-size:20px}.mt span{font-size:12px;color:var(--muted)}.mt.w b{color:#c0392b}
.mlg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 4px;flex-wrap:wrap}.mlg span{display:flex;align-items:center;gap:5px}.mlg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mlg i.lr{background:#2a78d6;box-shadow:0 0 0 2px #0c447c}.mlg i.lf{background:#c9c7bf}
.mp svg{width:100%;height:auto}.mb{fill:rgba(127,127,127,.10);stroke:rgba(127,127,127,.55);stroke-width:.7}
.md{stroke:#fff;stroke-width:.5;cursor:pointer}.md2{cursor:pointer}.mdf{cursor:pointer}.md2:hover{stroke:#0c447c;stroke-width:1.6}.mf{fill:#c9c7bf;opacity:.6;cursor:pointer}.mr{fill:#2a78d6;stroke:#0c447c;stroke-width:1.6;cursor:pointer}
.mtip{position:absolute;display:none;pointer-events:none;z-index:5;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;max-width:270px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.mtn{font-weight:700}.mts2{color:var(--muted);margin-bottom:4px}
.mtools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.mtools .btn{padding:4px 10px;font-size:13px}
.mlab{fill:var(--muted);text-anchor:middle;pointer-events:none;font-weight:600;opacity:.85}
svg.zm{cursor:grab;touch-action:none}svg.zm:active{cursor:grabbing}.mk{cursor:pointer}.mp svg.lgs{width:14px;height:14px;flex:none}
.mp:fullscreen{background:var(--paper);padding:18px;overflow:auto}.mp:fullscreen svg{max-height:78vh;width:auto;max-width:100%;display:block;margin:0 auto}
</style>
</head>
<body>
<header>
  <h1>Where to deploy the new cohort</h1>
  <p id="meta"></p>
</header>
<div class="wrap">
<aside>
  <div>
    <label>Cadre</label>
    <div class="cadre" role="group" aria-label="Cadre">
      <button data-c="Nurse">Nurse</button><button data-c="Midwife" aria-pressed="true">Midwife</button><button data-c="GP">GP</button>
    </div>
  </div>
  <nav aria-label="Pages">
    <button data-p="overview" aria-current="page">Overview</button>
    <button data-p="all">All facilities</button>
    <button data-p="deploy">Deployment list</button>
    <button data-p="plan">Plan a cohort</button>
    <button data-p="iplan">Plan intern allocation</button>
    <button data-p="profile">Facility profile</button>
    <button data-p="method">Data and method</button>
  </nav>
</aside>
<main id="main"></main>
</div>

P.method=()=>{const L=rows(r=>r.g>=4);const W=SET.WEIGHTS;

 <section class="box"><h3>Data used</h3><ul>
 <li><b>Services</b>, last six months: HMIS monthly reports for health centres and MHCs (OPD, ANC first visits × 4, deliveries); EMR for district and level-two hospitals (OPD, deliveries, C-sections, newborn bed-days), with gaps filled from HMIS.</li>

 <li><b>Facility list</b>: tier, district and province. Referral, specialised, rehabilitation and prison facilities are listed but not ranked.</li></ul></section>
 <section class="box"><h3>How the need is measured (one ranking per cadre)</h3><ol>
 <li>Monthly volume of each service = average of the months with data.</li>
 <li>Work of a cadre = volume × time per service × number of that cadre in the team. Time per service, relative to one outpatient visit: OPD ${W.OPD}, ANC ${W.ANC}, delivery ${W.DELIVERY}, C-section ${W.CSECTION}, newborn day ${W.NEO_BEDDAYS}.</li>
 <li>Work per person = work ÷ filled posts (÷ 1 if nobody is in post).</li>
 <li>Score = work per person ÷ typical value of the same cadre and tier. Above ${SET.HIGH} high need, ${SET.LOW} to ${SET.HIGH} normal, below ${SET.LOW} low.</li>
 <li>Ranking: high, then normal, then low; facilities with no staff of the cadre first inside each level.</li></ol></section>
 <section class="box"><h3>How a cohort is shared (Plan a cohort)</h3><ol>
 <li>High-workload facilities first, starting with those that have no staff of the cadre.</li>
 <li>Each high-workload facility receives the staff it needs to bring its workload back to normal, within its free posts. One person at a time, in rounds; the workload is recalculated after each person.</li>
 <li>Normal-workload facilities are served only when no high-workload facility can still receive. Unusually high numbers of free posts are limited to the usual number for the tier at this level.</li>
 <li>Low-workload facilities receive only if they have no staff of the cadre (their first person), and only at the end.</li>
 <li>Facilities with high need but no free post cannot receive; they are listed for a structure review.</li></ol>
 <p>Minimum team for day and night cover (staff in post): health centre 5 nurses and 5 midwives; MHC 5 nurses, 5 midwives, 5 GPs; hospitals 10 of each. The gap to this minimum raises the priority inside a level.</p></section>

 const inN=$("#inN");if(inN)inN.oninput=e=>{S.inN[S.ic]=Math.max(0,+e.target.value||0);};
 const ir=$("#irun");if(ir)ir.onclick=()=>{const c=S.ic,n=S.inN[c]||0;ITEST={c,n,alloc:internAllocate(c,n)};S.c=c;
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.p===S.p)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});document.querySelectorAll(".cadre button[data-c]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===S.c));render();const h=$("#istatH");if(h)h.scrollIntoView({behavior:"smooth",block:"start"});};
 const ix=$("#ixl");if(ix)ix.onclick=downloadIntern;
 const iq=$("#iq");if(iq)iq.onchange=e=>{S.iq=e.target.value;render();};
 const mw=$("#mwrap"),mt=$("#mtip");if(mw&&mt){mw.onmouseover=e=>{const ds=e.target.dataset||{};const sv=e.target.closest("svg");if(ds.id)mt.innerHTML=mapTip(ds.id,sv?sv.dataset.view:"before");else if(ds.dn&&e.target.classList.contains("md2")&&!S.dsel)mt.innerHTML=distTip(ds.dn);else return;mt.style.display="block";};
  mw.onmousemove=e=>{if(mt.style.display!=="block")return;const b=mw.getBoundingClientRect();let x=e.clientX-b.left+14,y=e.clientY-b.top+14;if(x>b.width-270)x-=284;mt.style.left=x+"px";mt.style.top=y+"px";};
  mw.onmouseout=e=>{const ds=e.target.dataset||{};if(ds.id||ds.dn)mt.style.display="none";};}
 const mv=$("#mview");if(mv)mv.onchange=e=>{S.mv=e.target.value;S.dsel=null;const y=window.scrollY;render();window.scrollTo(0,y);};
 if(mw){initZoom();mw.onclick=e=>{const sv=e.target.closest("svg");if(!sv||sv.dataset.view!=="district"||S.dsel)return;if(sv._moved){sv._moved=false;return;}
  const dn=e.target.dataset&&e.target.dataset.dn;if(dn){S.dsel=dn;const y=window.scrollY;render();window.scrollTo(0,y);}};}
 const qq=$("#q");if(qq)qq.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");if(n){n.focus();n.setSelectionRange(pos,pos);}};
 const fs=$("#fs");if(fs)fs.oninput=e=>{S.fs=e.target.value;$("#fsr").innerHTML=facilityStatus(S.fs);};
 const xo=$("#xov");if(xo)xo.onclick=()=>{const B=needSort(overallBefore(),x=>x.s,x=>x.filled),A=facilityTable(TEST.alloc,overallBefore()._med);
  const rB=new Map(B.map((x,i)=>[x.id,i+1])),rA=new Map(needSort(A,x=>x.s,x=>x.filled).map((x,i)=>[x.id,i+1])),sB=new Map(B.map(x=>[x.id,x])),sA=new Map(A.map(x=>[x.id,x]));
  const g=(c,id)=>(TEST.alloc[c]&&TEST.alloc[c][id])||0,num=v=>v==null?"":+v.toFixed(2);
  const rows=[["Rank before","Rank after","Places moved down (less need)","Facility","District","Province","Tier","Nurses received","Midwives received","GPs received","Total received","Score before","Score after","Need before","Need after"]];
  B.forEach(b=>{const a=sA.get(b.id),f=DATA.fac.find(x=>x.facility_id===b.id)||{};const t=g("Nurse",b.id)+g("Midwife",b.id)+g("GP",b.id);
   const nd=v=>v==null?"":bandOf(v)===3?"high":bandOf(v)===2?"normal":"low";
   rows.push([rB.get(b.id),rA.get(b.id)??"",rA.get(b.id)?rA.get(b.id)-rB.get(b.id):"",b.n,b.d,f.p||"",b.t,g("Nurse",b.id),g("Midwife",b.id),g("GP",b.id),t,num(b.s),num(a?a.s:null),nd(b.s),nd(a?a.s:null)]);});
  writeXls("before_after_overview.xls",[["Before-after overview",rows]]);};
 const xs=$("#xsit");if(xs)xs.onclick=()=>writeXls("current_situation.xls",[["All facilities",situationRows(null)]]);
 const rf=$("#rf");if(rf)rf.onchange=e=>{S.rf=e.target.value;render();};
 document.querySelectorAll(".ovgp").forEach(i=>i.onchange=()=>{OVC=i.checked?["Nurse","Midwife","GP"]:["Nurse","Midwife"];render();});
 const q=$("#rr");if(q)q.onchange=e=>{S.rr=e.target.value==="1";render();};
 const f=$("#fac");if(f)f.onchange=e=>{S.fac=e.target.value;render();};
 const fq=$("#facq");if(fq)fq.onchange=e=>{const x=DATA.fac.find(z=>z.name===e.target.value);if(x){S.fac=x.facility_id;render();}};}
document.querySelectorAll(".cadre button").forEach(b=>b.onclick=()=>{S.c=b.dataset.c;document.querySelectorAll(".cadre button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.p=b.dataset.p;document.querySelectorAll("nav button").forEach(x=>x.removeAttribute("aria-current"));b.setAttribute("aria-current","page");render();});

render();
</script></body></html>
